name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weavepad
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weavepad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weavepad"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      # Tests import the shared package's compiled workspace exports.
      - run: npm run build -w @weavepad/shared
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weavepad
      NEXT_PUBLIC_SYNC_URL: ws://127.0.0.1:1310
      E2E_SKIP_BUILD: '1'
      E2E_USE_PGLITE: '0'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weavepad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weavepad"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run e2e:install -w @weavepad/web -- --with-deps
      # The e2e server applies migrations to DATABASE_URL before starting apps.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config
      - run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test sync and web
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:1234/health
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null http://localhost:3310/login
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
