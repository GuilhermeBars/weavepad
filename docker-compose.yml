# Development defaults only: change all passwords and secrets in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weavepad
      POSTGRES_DB: weavepad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weavepad -d weavepad']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/sync-server/Dockerfile
    environment:
      DATABASE_URL: postgresql://weavepad:${POSTGRES_PASSWORD:-dev-postgres-password}@db:5432/weavepad
    command: ['node', 'packages/shared/scripts/migrate.mjs']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  sync:
    build:
      context: .
      dockerfile: apps/sync-server/Dockerfile
    environment:
      DATABASE_URL: postgresql://weavepad:${POSTGRES_PASSWORD:-dev-postgres-password}@db:5432/weavepad
      REDIS_URL: redis://redis:6379
      COLLAB_TOKEN_SECRET: ${COLLAB_TOKEN_SECRET:-dev-collab-token-secret-change-me}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-api-secret-change-me}
      SYNC_HOST: 0.0.0.0
      PORT: '1234'
    ports:
      - '1234:1234'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:1234/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser-visible address; rebuild the web image when changing this.
        NEXT_PUBLIC_SYNC_URL: ${NEXT_PUBLIC_SYNC_URL:-ws://localhost:1234}
    environment:
      DATABASE_URL: postgresql://weavepad:${POSTGRES_PASSWORD:-dev-postgres-password}@db:5432/weavepad
      AUTH_SECRET: ${AUTH_SECRET:-dev-auth-secret-change-me-before-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3310}
      AUTH_TRUST_HOST: 'true'
      COLLAB_TOKEN_SECRET: ${COLLAB_TOKEN_SECRET:-dev-collab-token-secret-change-me}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-api-secret-change-me}
      SYNC_INTERNAL_URL: http://sync:1234
      NEXT_PUBLIC_SYNC_URL: ${NEXT_PUBLIC_SYNC_URL:-ws://localhost:1234}
    ports:
      - '3310:3310'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      sync:
        condition: service_healthy

volumes:
  postgres-data:
